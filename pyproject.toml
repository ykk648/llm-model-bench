[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "model-bench"
version = "0.2.0"
description = "Configurable, serial LLM API benchmarks with an optional local dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
model-bench = "model_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_bench"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/examples", "/docs", "/README.md", "/LICENSE", "/SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
